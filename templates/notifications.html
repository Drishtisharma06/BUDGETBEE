{% extends "base.html" %}
{% block title %}Notifications | Smart Expense Tracker{% endblock %}
{% block content %}
<section class="panel notifications-panel">
  <div class="panel-header"><h2>Notifications</h2></div>
  <div class="notification-list">
    {% for alert in alerts %}
    <div class="notification-card notification-{{ alert.type }}">
      <h4>{{ alert.title }}</h4>
      <p>{{ alert.message }}</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
