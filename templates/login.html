{% extends "base.html" %}
{% block title %}Login | BudgetBee{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h2>Welcome Back!</h2>
    <p>Login to continue to your expense dashboard.</p>
    <form method="POST" class="input-form">
      <div>
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email address" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required />
      </div>
      <div class="form-row">
        <label class="checkbox-inline"><input type="checkbox" name="remember" /> Remember me</label>
      </div>
      <button type="submit" class="button primary">Login</button>
      <p class="small-note">Don’t have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </form>
  </div>
</section>
{% endblock %}
